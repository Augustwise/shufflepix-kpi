spring.application.name=shufflepix-server
server.port=8080

spring.datasource.url=${SHUFFLEPIX_DB_URL:jdbc:postgresql://localhost:5432/shufflepix_db}
spring.datasource.username=${SHUFFLEPIX_DB_USER:shufflepix}
spring.datasource.password=${SHUFFLEPIX_DB_PASSWORD:secret}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
